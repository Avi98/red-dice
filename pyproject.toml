[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "redis-event-loop"
version = "0.1.0"
description = "A Python re-implementation of Redis internals for learning and teaching"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
redis = "main:main"

[dependency-groups]
dev = ["pytest>=9.2.0", "ruff>=0.17.4", "ty>=0.0.100"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88


[tool.ruff.lint]
select = ["E", "F", "I", "ANN"]

[tool.ty.rules]
import-not-found = "ignore"
unused-ignore-comment = "warn"
possibly-unresolved-reference = "error"

[[tool.ty.overrides]]
include = ["src/legacy/**"]
rules = { missing-attribute = "ignore", invalid-assignment = "ignore" }
